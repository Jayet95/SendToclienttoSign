name = "sign"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV namespace that stores signing sessions.
# Create it once with:
#   npx wrangler kv namespace create SESSIONS
#   npx wrangler kv namespace create SESSIONS --preview
# then paste the returned ids below.
[[kv_namespaces]]
binding = "SESSIONS"
id = "53ee60c38105422c95d802dbf44176ed"
preview_id = "846370f631244049b691a2c08b54082a"

[vars]
CLINIC_NAME = "מכון פיזיותרפיה — שירלי מדמון ריבל"
# Allowed origin for the Pages site that calls this Worker.
# Use "*" while developing; set your Pages URL in production.
ALLOWED_ORIGIN = "*"

# WhatsApp Business API — set these as SECRETS (never commit tokens):
#   npx wrangler secret put WHATSAPP_TOKEN
#   npx wrangler secret put WHATSAPP_PHONE_ID
# When they are absent the Worker falls back to returning a wa.me link.
